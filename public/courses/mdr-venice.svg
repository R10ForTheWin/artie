<svg width="360" height="180" viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">

  <!-- Ocean background -->
  <rect width="360" height="180" fill="#C8DFF0"/>

  <!-- Coastal shallows -->
  <path d="M 0,0 L 112,0 C 109,30 107,62 108,82 L 108,136 C 110,154 116,168 122,180 L 0,180 Z"
    fill="#A8CBE0" opacity="0.5"/>

  <!-- Land (right of coast, includes harbor area before water overlay) -->
  <path d="M 360,0 L 120,0 C 117,30 115,62 116,82 L 116,136 C 118,154 124,168 130,180 L 360,180 Z"
    fill="#EDD9A3"/>

  <!-- Coastline stroke — north of harbor -->
  <path d="M 120,0 C 117,30 115,62 116,82" fill="none" stroke="#1B2A4A" stroke-width="1.5"/>
  <!-- Coastline stroke — south of harbor -->
  <path d="M 116,136 C 118,154 124,168 130,180" fill="none" stroke="#1B2A4A" stroke-width="1.5"/>

  <!-- MDR Harbor interior (water, overlaid on land) -->
  <rect x="116" y="82" width="215" height="54" fill="#B0D0E8"/>
  <!-- East wall of harbor -->
  <line x1="331" y1="82" x2="331" y2="136" stroke="#1B2A4A" stroke-width="1" opacity="0.5"/>
  <!-- Subtle horizontal divider to suggest marina basin structure -->
  <line x1="116" y1="108" x2="331" y2="108" stroke="#1B2A4A" stroke-width="0.5" opacity="0.25"/>

  <!-- North Jetty (extends NW from coast) -->
  <line x1="116" y1="82" x2="52" y2="76" stroke="#1B2A4A" stroke-width="4.5" stroke-linecap="round"/>
  <!-- South Jetty (extends NW from coast) -->
  <line x1="116" y1="136" x2="60" y2="130" stroke="#1B2A4A" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Venice Pier (extends west from coast, north of harbor) -->
  <line x1="117" y1="26" x2="46" y2="24" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round"/>

  <!-- Route: full closed loop
       Outbound: Mothers Beach (E side) → west through harbor → exit NW → coast N → Venice Pier
       Return:   Venice Pier → coast S → re-enter harbor → E side → Mothers Beach -->
  <path d="
    M 248,130
    C 205,131 160,127 138,116 C 116,108 80,105 56,103
    C 48,80 44,55 44,24
    C 52,55 57,80 63,103
    C 82,110 116,120 138,122 C 162,131 206,133 248,133 Z
  " fill="rgba(201,146,42,0.09)" stroke="#C9922A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Venice Pier endpoint -->
  <circle cx="44" cy="24" r="7.5" fill="#1B2A4A" stroke="#C9922A" stroke-width="2.5"/>

  <!-- Mothers Beach start marker -->
  <circle cx="248" cy="131" r="5.5" fill="#C9922A" stroke="#1B2A4A" stroke-width="1.5"/>

  <!-- Labels -->
  <text x="44" y="13" text-anchor="middle" fill="#1B2A4A" font-size="7.5" font-weight="bold" font-family="Arial, sans-serif">VENICE PIER</text>
  <text x="252" y="120" fill="#1B2A4A" font-size="6.5" font-weight="bold" font-family="Arial, sans-serif">MOTHERS</text>
  <text x="252" y="129" fill="#1B2A4A" font-size="6.5" font-weight="bold" font-family="Arial, sans-serif">BEACH</text>

  <!-- North indicator -->
  <polygon points="334,12 331,22 334,19 337,22" fill="#1B2A4A" opacity="0.35"/>
  <text x="334" y="30" text-anchor="middle" fill="#1B2A4A" font-size="7.5" font-family="Arial, sans-serif" opacity="0.35">N</text>

  <!-- Distance -->
  <text x="20" y="173" fill="#1B2A4A" font-size="7" font-family="Arial, sans-serif" opacity="0.35">~6 mi</text>

</svg>
