<svg width="360" height="200" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">

  <!-- Ocean background -->
  <rect width="360" height="200" fill="#C8DFF0"/>

  <!-- Harbor/Marina water (right of beach diagonal) -->
  <path d="M 108,0 L 360,0 L 360,200 L 244,200 Z" fill="#B0D0E8"/>

  <!-- Beach (sandy diagonal strip) -->
  <path d="M 55,0 L 108,0 L 244,200 L 191,200 Z" fill="#EDD9A3"/>

  <!-- Coastline stroke (ocean side of beach) -->
  <line x1="55" y1="0" x2="191" y2="200" stroke="#1B2A4A" stroke-width="1.2" opacity="0.6"/>
  <!-- Beach / harbor edge -->
  <line x1="108" y1="0" x2="244" y2="200" stroke="#1B2A4A" stroke-width="0.8" opacity="0.35"/>

  <!-- Land (far right, beyond marina) -->
  <path d="M 315,0 L 360,0 L 360,200 L 285,200 Z" fill="#EDD9A3" opacity="0.6"/>

  <!-- Marina finger piers (pairs extending west from east wall into harbor water) -->
  <g stroke="#1B2A4A" stroke-width="1.2" opacity="0.3">
    <line x1="210" y1="14" x2="308" y2="14"/>
    <line x1="210" y1="18" x2="308" y2="18"/>
    <line x1="210" y1="30" x2="308" y2="30"/>
    <line x1="210" y1="34" x2="308" y2="34"/>
    <line x1="210" y1="46" x2="308" y2="46"/>
    <line x1="210" y1="50" x2="308" y2="50"/>
    <line x1="210" y1="62" x2="308" y2="62"/>
    <line x1="210" y1="66" x2="308" y2="66"/>
    <line x1="210" y1="78" x2="308" y2="78"/>
    <line x1="210" y1="82" x2="308" y2="82"/>
    <line x1="210" y1="94" x2="308" y2="94"/>
    <line x1="210" y1="98" x2="308" y2="98"/>
    <line x1="210" y1="110" x2="308" y2="110"/>
    <line x1="210" y1="114" x2="308" y2="114"/>
    <line x1="210" y1="126" x2="308" y2="126"/>
    <line x1="210" y1="130" x2="308" y2="130"/>
    <line x1="210" y1="142" x2="308" y2="142"/>
    <line x1="210" y1="146" x2="308" y2="146"/>
    <line x1="210" y1="158" x2="308" y2="158"/>
    <line x1="210" y1="162" x2="308" y2="162"/>
  </g>

  <!-- Venice Pier (extends west from beach into ocean) -->
  <line x1="119" y1="90" x2="22" y2="90" stroke="#EDD9A3" stroke-width="7" stroke-linecap="round"/>
  <line x1="119" y1="90" x2="22" y2="90" stroke="#1B2A4A" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

  <!-- Route: closed loop
       Outbound: Mother's Beach → south through harbor → west along coast →
                 north along coast → Venice Pier tip (U-turn)
       Return:   Venice Pier tip → south coast → east into harbor → north to start -->
  <path d="
    M 256,18
    C 254,55 252,108 250,172
    C 192,176 100,176 28,172
    C 26,148 24,120 24,90
    Q 24,82 31,82
    C 31,120 31,148 34,172
    C 102,176 194,176 244,172
    C 246,108 248,55 262,18 Z
  " fill="rgba(201,146,42,0.10)" stroke="#C9922A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Venice Pier endpoint marker (turnaround) -->
  <circle cx="24" cy="90" r="6.5" fill="#1B2A4A" stroke="#C9922A" stroke-width="2.5"/>

  <!-- Mother's Beach start marker -->
  <circle cx="259" cy="18" r="5.5" fill="#C9922A" stroke="#1B2A4A" stroke-width="1.5"/>

  <!-- Labels -->
  <text x="22" y="75" text-anchor="middle" fill="#1B2A4A" font-size="7" font-weight="bold" font-family="Arial, sans-serif">VENICE</text>
  <text x="22" y="83" text-anchor="middle" fill="#1B2A4A" font-size="7" font-weight="bold" font-family="Arial, sans-serif">PIER</text>
  <text x="262" y="9" text-anchor="middle" fill="#1B2A4A" font-size="6.5" font-weight="bold" font-family="Arial, sans-serif">MOTHERS</text>
  <text x="262" y="16" text-anchor="middle" fill="#1B2A4A" font-size="6.5" font-weight="bold" font-family="Arial, sans-serif">BEACH</text>

  <!-- North indicator -->
  <polygon points="338,12 335,22 338,19 341,22" fill="#1B2A4A" opacity="0.3"/>
  <text x="338" y="30" text-anchor="middle" fill="#1B2A4A" font-size="7" font-family="Arial, sans-serif" opacity="0.3">N</text>

  <!-- Distance -->
  <text x="20" y="193" fill="#1B2A4A" font-size="7" font-family="Arial, sans-serif" opacity="0.35">~6 mi</text>

</svg>
