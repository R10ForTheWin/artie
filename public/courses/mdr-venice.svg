<svg width="360" height="180" viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Ocean -->
  <rect width="360" height="180" fill="#C8DFF0"/>

  <!-- Land – right side coast (north segment) -->
  <path d="M 242,0 L 242,93 L 360,93 L 360,0 Z" fill="#EDD9A3"/>
  <line x1="242" y1="0" x2="242" y2="93" stroke="#1B2A4A" stroke-width="1.5"/>

  <!-- Land – right side coast (south segment) -->
  <path d="M 242,145 L 242,180 L 360,180 L 360,145 Z" fill="#EDD9A3"/>
  <line x1="242" y1="145" x2="242" y2="180" stroke="#1B2A4A" stroke-width="1.5"/>

  <!-- MDR Harbor interior (water) -->
  <rect x="242" y="93" width="78" height="52" fill="#B0D0E8"/>
  <path d="M 242,93 L 320,93 L 320,145 L 242,145" fill="none" stroke="#1B2A4A" stroke-width="1"/>

  <!-- Land fill behind harbor (east end) -->
  <rect x="320" y="93" width="40" height="52" fill="#EDD9A3"/>
  <line x1="320" y1="93" x2="320" y2="145" stroke="#1B2A4A" stroke-width="1"/>

  <!-- MDR North Jetty -->
  <line x1="242" y1="93" x2="182" y2="91" stroke="#1B2A4A" stroke-width="4.5" stroke-linecap="round"/>

  <!-- MDR South Jetty -->
  <line x1="242" y1="145" x2="197" y2="143" stroke="#1B2A4A" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Venice Pier -->
  <line x1="242" y1="42" x2="190" y2="42" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round"/>

  <!-- Route outbound: Mothers Beach → harbor mouth → north → Venice Pier -->
  <path d="M 292,128 L 222,120 L 174,112 Q 154,82 158,58 L 188,42" fill="none" stroke="#C9922A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Route return: Venice Pier → south → harbor mouth → Mothers Beach -->
  <path d="M 192,42 Q 162,60 158,62 Q 153,84 178,116 L 228,124 L 292,132" fill="none" stroke="#C9922A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- Venice Pier endpoint -->
  <circle cx="190" cy="42" r="7" fill="#1B2A4A" stroke="#C9922A" stroke-width="2.5"/>

  <!-- Mothers Beach start -->
  <circle cx="292" cy="130" r="5.5" fill="#C9922A" stroke="#1B2A4A" stroke-width="1.5"/>

  <!-- Labels -->
  <text x="190" y="29" text-anchor="middle" fill="#1B2A4A" font-size="7.5" font-weight="bold" font-family="Arial, sans-serif" letter-spacing="0.5">VENICE PIER</text>
  <text x="292" y="149" text-anchor="middle" fill="#1B2A4A" font-size="7" font-weight="bold" font-family="Arial, sans-serif">MOTHERS</text>
  <text x="292" y="158" text-anchor="middle" fill="#1B2A4A" font-size="7" font-weight="bold" font-family="Arial, sans-serif">BEACH</text>

  <!-- North indicator -->
  <polygon points="22,12 19,22 22,19 25,22" fill="#1B2A4A" opacity="0.35"/>
  <text x="22" y="30" text-anchor="middle" fill="#1B2A4A" font-size="7.5" font-family="Arial, sans-serif" opacity="0.35">N</text>

  <!-- Distance hint -->
  <text x="20" y="170" fill="#1B2A4A" font-size="7" font-family="Arial, sans-serif" opacity="0.35">~6 mi</text>
</svg>
