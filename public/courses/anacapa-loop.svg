<svg width="360" height="180" viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">

  <!-- Ocean / Santa Barbara Channel background -->
  <rect width="360" height="180" fill="#C8DFF0"/>

  <!-- Nearshore shallows along Oxnard coast -->
  <path d="M 0,0 L 360,0 L 360,72 Q 310,65 255,68 Q 210,62 188,75 Q 162,62 108,66 Q 55,62 0,70 Z"
    fill="#A8CBE0" opacity="0.5"/>

  <!-- Oxnard / Ventura coastline (land at top) -->
  <path d="M 0,0 L 360,0 L 360,64 Q 310,57 255,60 Q 210,55 188,68 Q 162,55 108,58 Q 55,55 0,62 Z"
    fill="#EDD9A3"/>

  <!-- Coastline stroke -->
  <path d="M 0,62 Q 55,55 108,58 Q 162,55 188,68 Q 210,55 255,60 Q 310,57 360,64"
    fill="none" stroke="#1B2A4A" stroke-width="1.5"/>

  <!-- Channel Islands Harbor (opens south into channel) -->
  <!-- Harbor basin water -->
  <path d="M 148,62 L 148,90 L 186,90 L 186,62" fill="#B0D0E8" stroke="none"/>
  <!-- West jetty (extends south from coast) -->
  <line x1="148" y1="62" x2="142" y2="52" stroke="#1B2A4A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- East jetty (extends south from coast) -->
  <line x1="186" y1="62" x2="192" y2="52" stroke="#1B2A4A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Harbor east/west walls faint -->
  <line x1="148" y1="62" x2="148" y2="90" stroke="#1B2A4A" stroke-width="0.8" opacity="0.4"/>
  <line x1="186" y1="62" x2="186" y2="90" stroke="#1B2A4A" stroke-width="0.8" opacity="0.4"/>
  <line x1="148" y1="90" x2="186" y2="90" stroke="#1B2A4A" stroke-width="0.8" opacity="0.4"/>

  <!-- Anacapa Island (elongated E-W, roughly 11 mi south of harbor) -->
  <!-- Slight shallows around island -->
  <ellipse cx="196" cy="152" rx="44" ry="13" fill="#A8CBE0" opacity="0.5"/>
  <!-- Island itself -->
  <ellipse cx="196" cy="150" rx="40" ry="9.5" fill="#EDD9A3" stroke="#1B2A4A" stroke-width="1.5"/>

  <!-- Route: from harbor mouth, south to island, clockwise loop, return north
       Outbound goes slightly west (offshore), return slightly east (inshore) -->
  <!-- Harbor exit point: (167, 90) center of harbor mouth -->
  <!-- Island east approach: (236, 146) -->
  <path d="
    M 167,89
    C 158,108 150,128 158,143
    Q 196,138 236,143
    Q 240,152 236,160
    Q 196,164 156,160
    Q 152,152 158,143
    C 172,128 178,108 176,89 Z
  " fill="rgba(201,146,42,0.09)" stroke="#C9922A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Harbor start marker -->
  <circle cx="167" cy="89" r="5.5" fill="#C9922A" stroke="#1B2A4A" stroke-width="1.5"/>

  <!-- Anacapa waypoint marker (island loop point) -->
  <circle cx="196" cy="150" r="6.5" fill="#1B2A4A" stroke="#C9922A" stroke-width="2.5"/>

  <!-- Labels -->
  <text x="167" y="102" text-anchor="middle" fill="#1B2A4A" font-size="7" font-weight="bold" font-family="Arial, sans-serif">CH. ISLANDS</text>
  <text x="167" y="110" text-anchor="middle" fill="#1B2A4A" font-size="7" font-weight="bold" font-family="Arial, sans-serif">HARBOR</text>
  <text x="196" y="170" text-anchor="middle" fill="#1B2A4A" font-size="7.5" font-weight="bold" font-family="Arial, sans-serif">ANACAPA ISLAND</text>

  <!-- North indicator -->
  <polygon points="334,12 331,22 334,19 337,22" fill="#1B2A4A" opacity="0.35"/>
  <text x="334" y="30" text-anchor="middle" fill="#1B2A4A" font-size="7.5" font-family="Arial, sans-serif" opacity="0.35">N</text>

  <!-- Distance -->
  <text x="20" y="173" fill="#1B2A4A" font-size="7" font-family="Arial, sans-serif" opacity="0.35">~25 mi</text>

</svg>
