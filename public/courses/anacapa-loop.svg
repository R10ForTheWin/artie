<svg width="360" height="180" viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Ocean -->
  <rect width="360" height="180" fill="#C8DFF0"/>

  <!-- Land – Oxnard coastline at top (irregular) -->
  <path d="M 0,0 L 360,0 L 360,64 Q 310,57 255,60 Q 205,57 185,68 Q 160,56 105,60 Q 55,57 0,63 Z" fill="#EDD9A3"/>
  <path d="M 0,63 Q 55,57 105,60 Q 160,56 185,68 Q 205,57 255,60 Q 310,57 360,64" fill="none" stroke="#1B2A4A" stroke-width="1.5"/>

  <!-- Channel Islands Harbor (indented into land) -->
  <path d="M 138,64 L 138,90 L 176,90 L 176,64" fill="#B0D0E8" stroke="#1B2A4A" stroke-width="1"/>

  <!-- Harbor west jetty -->
  <line x1="138" y1="64" x2="131" y2="54" stroke="#1B2A4A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Harbor east jetty -->
  <line x1="176" y1="64" x2="182" y2="54" stroke="#1B2A4A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Anacapa Island -->
  <ellipse cx="200" cy="148" rx="40" ry="9.5" fill="#EDD9A3" stroke="#1B2A4A" stroke-width="1.5"/>

  <!-- Route outbound: harbor → east end of Anacapa -->
  <path d="M 157,89 Q 172,115 200,140" fill="none" stroke="#C9922A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Loop around Anacapa (clockwise: east → south → west → north → east) -->
  <path d="M 200,140 Q 240,138 240,148 Q 240,159 200,160 Q 160,159 160,148 Q 160,138 200,140" fill="none" stroke="#C9922A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Route return: east end → harbor (slightly offset) -->
  <path d="M 204,140 Q 190,116 160,91" fill="none" stroke="#C9922A" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Harbor start marker -->
  <circle cx="157" cy="90" r="5.5" fill="#C9922A" stroke="#1B2A4A" stroke-width="1.5"/>

  <!-- Anacapa waypoint (east end) -->
  <circle cx="200" cy="140" r="6.5" fill="#1B2A4A" stroke="#C9922A" stroke-width="2.5"/>

  <!-- Labels -->
  <text x="157" y="104" text-anchor="middle" fill="#1B2A4A" font-size="7" font-weight="bold" font-family="Arial, sans-serif">CH. ISLANDS</text>
  <text x="157" y="113" text-anchor="middle" fill="#1B2A4A" font-size="7" font-weight="bold" font-family="Arial, sans-serif">HARBOR</text>
  <text x="200" y="170" text-anchor="middle" fill="#1B2A4A" font-size="7.5" font-weight="bold" font-family="Arial, sans-serif" letter-spacing="0.3">ANACAPA ISLAND</text>

  <!-- North indicator -->
  <polygon points="326,12 323,22 326,19 329,22" fill="#1B2A4A" opacity="0.35"/>
  <text x="326" y="30" text-anchor="middle" fill="#1B2A4A" font-size="7.5" font-family="Arial, sans-serif" opacity="0.35">N</text>

  <!-- Distance hint -->
  <text x="20" y="170" fill="#1B2A4A" font-size="7" font-family="Arial, sans-serif" opacity="0.35">~25 mi</text>
</svg>
