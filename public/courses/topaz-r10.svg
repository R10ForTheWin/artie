<svg width="360" height="180" viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Ocean -->
  <rect width="360" height="180" fill="#C8DFF0"/>

  <!-- Land – right side coast, slight curve -->
  <path d="M 262,0 Q 257,90 262,180 L 360,180 L 360,0 Z" fill="#EDD9A3"/>
  <path d="M 262,0 Q 257,90 262,180" fill="none" stroke="#1B2A4A" stroke-width="1.5"/>

  <!-- MDR North Jetty (shorter) -->
  <line x1="261" y1="65" x2="226" y2="63" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round"/>

  <!-- MDR South Jetty / Topaz (longer) -->
  <line x1="261" y1="108" x2="193" y2="105" stroke="#1B2A4A" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Route outbound: jetty tip → R10 (curving WNW) -->
  <path d="M 192,103 Q 138,88 56,73" fill="none" stroke="#C9922A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Route return: slightly offset, lower opacity -->
  <path d="M 56,78 Q 138,96 192,108" fill="none" stroke="#C9922A" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- R10 Buoy -->
  <circle cx="56" cy="75" r="7.5" fill="#1B2A4A" stroke="#C9922A" stroke-width="2.5"/>

  <!-- Start / End at jetty tip -->
  <circle cx="193" cy="106" r="5.5" fill="#C9922A" stroke="#1B2A4A" stroke-width="1.5"/>

  <!-- Labels -->
  <text x="56" y="61" text-anchor="middle" fill="#1B2A4A" font-size="8.5" font-weight="bold" font-family="Arial, sans-serif" letter-spacing="0.5">R10</text>
  <text x="267" y="103" fill="#1B2A4A" font-size="7.5" font-weight="bold" font-family="Arial, sans-serif" letter-spacing="0.5">TOPAZ</text>
  <text x="267" y="114" fill="#1B2A4A" font-size="7.5" font-weight="bold" font-family="Arial, sans-serif" letter-spacing="0.5">JETTY</text>

  <!-- North indicator (top-left, in water) -->
  <polygon points="22,12 19,22 22,19 25,22" fill="#1B2A4A" opacity="0.35"/>
  <text x="22" y="30" text-anchor="middle" fill="#1B2A4A" font-size="7.5" font-family="Arial, sans-serif" opacity="0.35">N</text>

  <!-- Distance hint -->
  <text x="20" y="170" fill="#1B2A4A" font-size="7" font-family="Arial, sans-serif" opacity="0.35">~10 mi</text>
</svg>
